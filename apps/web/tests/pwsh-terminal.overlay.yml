# The pwsh terminal-card lane swaps the shipped bash stack for the PowerShell
# twin: the bash executor row is disabled (patches cannot rename a row — `name`
# is a guard), the pwsh executor is inserted, and the pwsh tool — a base row
# the web-app bundle patch disables (packages/bundle/web-app/cordis.patch.yml)
# — is RE-ENABLED via a top-level `disabled: false` patch rather than
# inserted again; a second inserted `tool-pwsh` row would collide with the
# base-defined id and the composed profile would refuse to boot with a
# duplicate loader entry id. The permission service refuses an unconfined
# executor by design (presets bundle a sandbox mode), so its row is disabled
# too — this lane renders a seeded session, never a permission decision. The
# seeded scenario renders the logged pwsh call/result through the real tools
# on replay; no command executes, but the composition must boot the pwsh
# executor, so the lane skips on hosts without a usable `pwsh`.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: true
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
- insert:
    - id: pwsh-local
      name: '@deepseek-ai/dsh-pwsh-local'
