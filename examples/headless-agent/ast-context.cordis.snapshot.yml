# Replay counterpart to ast-context.cordis.yml. It restates the agent overlay
# (the provider/model swap) and the persistence compression choice, disables
# the key-requiring providers, and inserts `llm-replay` to serve the recorded
# session without a key or network.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: opencode
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          # Replay fixtures are raw JSONL; the whole-config patch must restate
          # the compression choice or the default zstd frames hide the logs.
          compression: none
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: opencode
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000