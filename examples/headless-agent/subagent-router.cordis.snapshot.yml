# Keyless real-Loader composition for the subagent-router routing snapshot.
# Two in-process providers are mounted; the router's default candidate list
# names only `fork`, while its single route (`label: trial probe`) names only
# `spawn`. The replayed delegation's description matches the route, so the
# assembled app proves label routing physically: the child session's durable
# descriptor names `spawn`, which the default candidates alone could never
# produce. The router plugin registers the `subagent` tool itself, so
# `dsh-tool-subagent` must stay absent from this tree.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

# file/override/childFiles all default to their DSH_SNAPSHOT_* env vars.
- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    providers:
      - id: replay
        models:
          - id: deepseek-v4-flash
            contextWindow: 128000

# This scenario probes delegation routing only, so the bash/fs stacks are
# absent and the bundle's optional surfaces stay off.
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: replay
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: |
      You are headless-agent, a routing snapshot fixture.

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: router
  name: '@deepseek-ai/dsh-plugin-subagent-router'
  config:
    providers:
      - fork
    # The route also pins the child's model tier: per-route agentOptions win
    # over the global override, and the replayed child's request header carries
    # the pinned maxTokens as durable proof.
    routes:
      - label: trial probe
        providers:
          - spawn
        agentOptions:
          provider: replay
          model: deepseek-v4-flash
          maxTokens: 512
