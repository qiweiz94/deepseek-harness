- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: disabled
          # The keep-alive scenario streams comments every 240ms and the payload at
          # +960ms (headless.snapshot deepseekDefaultsServer); this idle budget sits
          # between them so keep-alives are required to hold the stream open, with
          # ~360ms of slack above the 240ms cadence to absorb runner scheduling jitter
          # (a tighter value armed before time-to-first-byte flakes under CI CPU load).
          streamIdleTimeoutMs: 600
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
