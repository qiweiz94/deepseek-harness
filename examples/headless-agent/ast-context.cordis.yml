# Record get_file_outline through the OpenCode gateway. This overlay keeps the
# headless-agent composition while swapping the key-requiring DeepSeek adapter
# for a pi-ai route on the OpenAI-compatible OpenCode API, and re-pins the
# agent's provider/model so the recorded header matches what replay serves.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: opencode
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                opencode:
                  displayName: OpenCode
                  apiKeyEnv: OPENCODE_API_KEY
                  api: openai-completions
                  baseURL: https://opencode.ai/zen/go/v1
                  models:
                    - id: deepseek-v4-flash
                      name: DeepSeek V4 Flash
                      contextWindow: 128000