# Fork-hosted CI: the standard-hosted substitute for ci.yml on personal forks.
# ci.yml resolves its Linux lanes through enterprise runner pools and
# self-hosted labels that only the upstream repository provides, so on a fork
# every ci.yml run dies at startup with zero jobs. This workflow runs the same
# gate aggregates (scripts/run-gates.ts) on standard hosted runners. Every job
# is guarded to fork owners so the file stays inert if it rides a pull request
# into upstream. Rationale and gate accounting:
# .agents/notes/implemented/process/2026-08-19-fork-hosted-ci-workflow.md
name: Fork CI

on:
  push:
    branches: [master]
  pull_request:

# Same push exemption as ci.yml: a superseded pull-request run is waste, but a
# master push run is the only post-merge evidence and must reach a verdict.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:

  static:
    if: github.repository_owner != 'deepseek-ai'
    runs-on: ubuntu-latest
    name: fork / static + doc-sync
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # The archive gate inside check:ci:static diffs against the pull
          # request base, which a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:ci:static

      # typecheck lives only in ci-primary and verify-third-party-notices in
      # no aggregate at all; both belong to the fork's full local gate set.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Third-party notices
        run: pnpm run verify-third-party-notices

  coverage:
    if: github.repository_owner != 'deepseek-ai'
    runs-on: ubuntu-latest
    name: fork / coverage
    timeout-minutes: 120
    env:
      # ci-coverage splits DSH_COVERAGE_MAX_WORKERS between the instrumented
      # suite and the coverage-exempt heavy suite; 4 is the hosted core count.
      DSH_COVERAGE_MAX_WORKERS: '4'
      DSH_GATE_CONCURRENCY: '2'
      # Hosted 4-core runners overrun locally-tuned test timeouts under gate
      # contention: heavy suites exceed the 4x (20s) bound on this lane (#23).
      # No CI failure log is available to name the offending suite(s); the
      # most PLAUSIBLE (unconfirmed) candidates are the real-process suites
      # this repo already tracks as expensive — scripts/coverage-exempt.ts's
      # compiler-heavy typert/generator and child-process scripts/*.spec.ts
      # fixtures, plus the process-bound vitest project (subprocess,
      # subagent-acp, workflow-worker-thread, app-boot, time-context,
      # llm-pi-ai). Raised to 6 (30s) for headroom without loosening the
      # un-factored local default (vitest.shared.ts scaledTimeout) — a
      # conservative, lane-scoped bump pending the next fork CI run.
      DSH_TEST_TIMEOUT_FACTOR: '6'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run coverage gates
        run: pnpm run check:ci:coverage

  consumers:
    if: github.repository_owner != 'deepseek-ai'
    runs-on: ubuntu-latest
    name: fork / build, snapshots, artifacts
    # Raised from 90: DSH_SNAPSHOT_MAX_CONCURRENCY=1 below serializes every
    # snapshot test file plus every scenario within them, adding job-level
    # wall time on top of the per-test headroom fixed elsewhere in this job.
    # Unmeasured against a real fork run; widen further if this job now hits
    # ITS OWN ceiling instead of the test-level one.
    timeout-minutes: 120
    env:
      # ci-consumers defaults its gate concurrency to the gate count (~11),
      # which thrashes a 4-core hosted runner.
      DSH_GATE_CONCURRENCY: '4'
      # node-compat's typecheck duplicates this workflow's static lane.
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '4'
      DSH_PUBLINT_CONCURRENCY: '4'
      # Lowered from 2 to 1: at 2, the subagent-continuable-inheritance scenario
      # (which spawns multiple real agent subprocesses) still timed out at the
      # fixed 120s vitest test-level ceiling (vitest.snapshot.config.ts
      # testTimeout) under 4-core contention. 1 also disables in-file scenario
      # concurrency (vitest.snapshot.config.ts wires maxConcurrency and
      # fileParallelism off this same value), so the heavy scenario runs alone
      # with the runner's full 4 cores instead of sharing them with a
      # concurrent scenario — attacking the contention itself rather than only
      # widening the timeout. The 120s ceiling itself is widened separately in
      # vitest.snapshot.config.ts, since that bound is NOT scaled by
      # DSH_TEST_TIMEOUT_FACTOR below.
      # Trade-off: fileParallelism off means every snapshot test file (not just
      # the heavy scenario's neighbors) now runs serially, on top of the 78
      # scenarios inside examples/acp-agent/tests/acp.snapshot.ts also running
      # one at a time — total lane wall time rises accordingly (this job's
      # timeout-minutes is widened below for margin).
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
      # Scales vitest test timeouts elsewhere (via scaledTimeout) and the
      # acp-snapshot harness's own internal persistence waits (10s * this
      # factor) — NOT the fixed 120s vitest.snapshot.config.ts testTimeout,
      # which the DSH_SNAPSHOT_MAX_CONCURRENCY drop above and the
      # vitest.snapshot.config.ts widening address instead. Kept at 12x
      # (already raised from 4x/8x for the subagent-continuable-inheritance
      # scenario's competing agent subprocesses); unrelated to this timeout,
      # so left unchanged.
      DSH_TEST_TIMEOUT_FACTOR: '12'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run consumer gates
        run: pnpm run check:ci:consumers
